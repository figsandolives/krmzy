<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تحميل تطبيقات كرمزي TV</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070a;
      --panel: #101722;
      --text: #f6fbff;
      --muted: #b7c3d2;
      --krmzy: #00e5ff;
      --wa: #25d366;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(920px, calc(100vw - 64px));
      padding: 42px;
      background: var(--panel);
      border: 2px solid #243044;
      border-radius: 8px;
    }
    h1 {
      margin: 0 0 14px;
      font-size: 44px;
      line-height: 1.2;
    }
    p {
      margin: 0 0 34px;
      color: var(--muted);
      font-size: 24px;
      line-height: 1.7;
    }
    .buttons {
      display: grid;
      gap: 22px;
    }
    a {
      display: block;
      padding: 28px 32px;
      border-radius: 8px;
      color: #031014;
      text-decoration: none;
      font-size: 32px;
      font-weight: 800;
      text-align: center;
      outline: 5px solid transparent;
      outline-offset: 5px;
    }
    a:focus {
      outline-color: #fff;
    }
    .krmzy { background: var(--krmzy); }
    .whatsapp { background: var(--wa); color: #02130a; }
    .hint {
      margin-top: 28px;
      margin-bottom: 0;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <main>
    <h1>تحميل تطبيقات التلفزيون</h1>
    <p>اختر التطبيق بزر OK من الريموت. بعد التحميل افتح الملف من التنزيلات وثبته على التلفزيون.</p>
    <div class="buttons">
      <a class="krmzy" href="Turkish-Series.apk" download>تحميل مسلسلات تركية</a>
      <a class="whatsapp" href="WhatsApp-TV.apk" download>تحميل تطبيق واتساب TV</a>
    </div>
    <p class="hint">إذا طلب التلفزيون السماح بالتثبيت من المتصفح، وافق من الإعدادات ثم ارجع وافتح ملف APK.</p>
  </main>
</body>
</html>
